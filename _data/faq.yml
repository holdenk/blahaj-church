- question: Is this satire?
  category: General
  answer: >
    No. The Blahaj Church is a real, active spiritual community. We gather monthly in the San Francisco
    Bay Area for worship, hold weekly virtual gatherings, and are building a community rooted in the
    belief that gender diversity is sacred. Our name may be playful, but our mission is sincere.

- question: Is the Blahaj Church legally a church?
  category: General
  answer: >
    We are an active spiritual community that is in the process of seeking formal recognition.
    Regardless of legal status, we are a real community of people who gather regularly for worship,
    mutual support, and spiritual practice.

- question: Are donations tax-deductible?
  category: General
  answer: >
    This is complicated, at this time we are not a federally recognized non-profit so it is best to assume they are not.

- question: What is a Blahaj?
  category: General
  answer: >
    "Blahaj" is the Swedish word for "blue shark" and is also the name of a popular IKEA stuffed shark toy.
    During the COVID-19 pandemic, the Blahaj became a beloved symbol of comfort and solidarity in the
    trans community online. We adopted the name as a symbol of that warmth and support. The Blahaj Church
    is not affiliated with or endorsed by IKEA.

- question: Can allies join?
  category: Participation
  answer: >
    Yes. We welcome all who affirm and accept the sacredness of trans, gender non-conforming, and intersex
    people. You do not need to be trans to be part of our community — you need to share our values of
    love, acceptance, and support.

- question: What does "HRT Communion" mean?
  category: Participation
  answer: >
    HRT Communion is a gathering where members who take hormone replacement therapy may choose to do so
    together as a communal act of affirmation and celebration. It is a spiritual ritual, not a medical
    service. The church does not prescribe, dispense, or administer any medications. Members bring and
    take their own prescribed medications. Participation is entirely voluntary — members who do not take
    HRT, or prefer to take it privately, participate through presence and support.

- question: Does the church provide medical advice?
  category: Medical
  answer: >
    No. All references to HRT, puberty blockers, and other medical treatments on this site are spiritual
    affirmations of their value. We do not provide medical advice, prescriptions, or medical services.
    We always encourage individuals to work with qualified healthcare providers for medical decisions.
    Our ministers are trained in basic safety skills (first aid, naloxone administration) as a
    harm-reduction measure, not as medical practitioners.

- question: How do I attend a gathering?
  category: Participation
  answer: >
    Email us at info@blahajchurch.org to join our mailing list. We share specific meeting locations
    by email in advance of each gathering for security reasons. We meet monthly in the San Francisco
    Bay Area, alternating between Oakland and San Francisco, and hold weekly virtual gatherings online.

- question: Do you have a physical church building?
  category: Participation
  answer: >
    No, we do not have a permanent building. We gather in rented and borrowed spaces in the San Francisco
    Bay Area. Because our congregation is small and faces security concerns due to anti-trans hostility,
    we share specific locations only by email with those who RSVP. We also gather online for
    virtual worship.

- question: Can I participate anonymously?
  category: Safety
  answer: >
    Yes. You can participate without using your legal name, without sharing your location, and without
    appearing on camera during virtual gatherings. We do not require identity documents to join or
    participate. See our Safety & Privacy page for more details about how we protect our community.

- question: What is the relationship with the Sparkling Pink Pandas?
  category: General
  answer: >
    The Sparkling Pink Pandas (SPP) is an independent trans-focused motorcycle and scooter group based
    in San Francisco. Several of our congregants are also SPP members.
    SPP is not a ministry of the church — it is a separate community
    organization with its own mission — but we share members, values, and a commitment to trans visibility
    and safety.

- question: How do you pronounce Blahaj?
  category: General
  answer: >
    Broadly speaking the "english" way. While Blahaj has a swedish pronounciation we choose the english pronounciation to avoid confusion when talking about the church v.s. our brave stuffed animal companions.
