- title: Sacredness of Gender Diversity
  summary: Gender diversity is sacred. Every trans, intersex, and gender non-conforming person is created in the image of the divine.
  icon: star
  group: The Sacred Body
  body: >
    We recognize and honor the diversity of gender identities and expressions as sacred and valuable.
    All trans, intersex, and gender non-conforming individuals are created in the image of the divine.
    Across cultures and throughout history, those who transcend the boundaries of gender have been recognized
    as carriers of spiritual truth. We stand in that ancient tradition.

- title: Hormone Replacement Therapy
  summary: HRT is a sacred tool for those who seek it, helping individuals live fully in their true gender.
  icon: heart
  group: The Sacred Body
  body: >
    We affirm the spiritual significance of hormone replacement therapy for those who desire it.
    HRT can be a vital part of living and presenting in one's congruent gender. We celebrate those who
    choose this path as part of their journey of self-realization. The church does not prescribe,
    dispense, or administer medications — we honor the choice and encourage individuals to work
    with qualified healthcare providers.

- title: Puberty Blockers
  summary: We support access to puberty blockers for young people experiencing gender dysphoria.
  icon: shield-alt
  group: The Sacred Body
  body: >
    We recognize the value of puberty blockers for young people experiencing gender dysphoria.
    These medications can help alleviate the distress caused by incongruence between gender identity
    and the changes of puberty. We support families working with qualified healthcare providers to
    explore all options for their children's well-being.

- title: Living in Your True Gender
  summary: Living and presenting in your congruent gender is a sacred act of authenticity.
  icon: sun
  group: The Sacred Body
  body: >
    Living and presenting in one's congruent gender is an important aspect of the gender affirmation
    journey. We support individuals in their efforts to be seen and known as they truly are, and we
    strive to create a community that celebrates gender diversity in all its forms.

- title: Holy Rituals
  summary: Our rituals honor the journey of gender affirmation as a sacred, communal experience.
  icon: hands
  group: Holy Practice
  body: >
    We hold holy rituals that honor the journey of gender affirmation, including communal moments where
    members who take their own prescribed HRT may choose to do so together as an act of celebration and
    solidarity. These rituals affirm and celebrate the sacredness of trans, gender non-conforming, and
    intersex lives. Participation is always voluntary.

- title: Informed Consent
  summary: Bodily autonomy is holy. You have the right to choose what happens to your body.
  icon: check-circle
  group: Holy Practice
  body: >
    We believe that for matters of one's body, every person should have the freedom to choose what
    procedures they undergo. This includes but is not limited to gender-affirming care and reproductive
    healthcare. Bodily autonomy is a fundamental human right and a sacred principle.

- title: Safety
  summary: Protecting yourself and your community is a sacred act of self-love.
  icon: lock
  group: Holy Practice
  body: >
    Because our community has historically been marginalized, taking actions to protect oneself and
    one's community is a sacred act of self-love. We invest in safety training, de-escalation skills,
    and mutual protection because we believe every member of our community deserves to feel safe.

- title: Love is Love
  summary: We celebrate all consenting adult relationships, regardless of gender.
  icon: heart
  group: Love and Justice
  body: >
    We recognize and celebrate all consenting adult relationships, regardless of gender. Everyone
    has the right to love and be loved without discrimination. Any ordained minister of the Blahaj
    Church may solemnize marriages, commitment ceremonies, and weddings for all who wish to publicly
    declare their love and commitment to each other.

- title: Welcoming All
  summary: Everyone who affirms the sacredness of gender diversity has a place here.
  icon: door-open
  group: Love and Justice
  body: >
    We welcome all who venerate and accept the sacredness of trans, gender non-conforming, and intersex
    people. Regardless of your own gender identity or expression, you have a place in our community if
    you share our values of love, acceptance, and support.

- title: Right of Self-Determination
  summary: Every person has the right to define and express their own gender identity.
  icon: fist-raised
  group: Love and Justice
  body: >
    We believe in the fundamental human right of self-determination, especially regarding gender identity,
    expression, and bodily autonomy. Gender is complex and multifaceted, and every individual has the right
    to express their gender in a way that is true to themselves, regardless of societal norms and expectations.

- title: Facility Access
  summary: Everyone deserves to access facilities that match their gender identity, without fear.
  icon: restroom
  group: Love and Justice
  body: >
    Every individual has the right to access gender-segregated facilities and services that correspond to
    their gender identity. Trans, gender non-conforming, and intersex individuals should be able to use
    bathrooms, locker rooms, and other facilities that align with their gender identity without fear of
    discrimination or harassment.

- title: Participation in Sport
  summary: Trans and gender non-conforming people belong in sports.
  icon: running
  group: Love and Justice
  body: >
    Individuals should have the right to participate in sports that align with their gender identity.
    Trans and gender non-conforming individuals should not be excluded from sports based solely on
    their gender identity. Any restrictions should be based on relevant factors such as skill level
    or age, not gender identity.

- title: Sexual Health
  summary: Everyone deserves safe, shame-free access to sexual healthcare.
  icon: medkit
  group: Health and Wholeness
  body: >
    Everyone has the right to enjoy their sexuality safely and responsibly. We support safer sex practices,
    including condoms, PrEP, and other prevention methods. Everyone should have access to quality healthcare,
    including sexual health care, free from shame or stigma.

- title: Right to Abortion
  summary: The decision to bring life into the world is sacred and belongs to the pregnant person alone.
  icon: hand-holding-heart
  group: Health and Wholeness
  body: >
    The decision to bring life into the world is a sacred one and should be made with careful consideration.
    If a pregnant person chooses to have an abortion, they should be able to do so safely and without shame
    or stigma. We support access to all reproductive healthcare, including medication abortion, in a
    supportive environment free from judgment.
